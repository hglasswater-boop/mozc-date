name: Windows x64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_x64:
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Set product version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+\.0)$') {
            throw "Release tags must use four numeric components and end in .0 for Windows Installer compatibility: $env:GITHUB_REF_NAME"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MOZC_VERSION=$($Matches[1])" -Encoding utf8

      - name: Check product version ordering
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previousTag = gh api "repos/$($env:GITHUB_REPOSITORY)/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the latest published release tag."
          }
          $previousVersionText = $previousTag.Trim() -replace '^v', ''
          $previousVersion = [version]$previousVersionText
          $nextVersion = [version]$env:MOZC_VERSION
          if ($nextVersion -le $previousVersion) {
            throw "Product version $nextVersion must be newer than the latest release $previousVersion."
          }
          $previousMsiVersion = [version]("$($previousVersion.Major).$($previousVersion.Minor).$($previousVersion.Build)")
          $nextMsiVersion = [version]("$($nextVersion.Major).$($nextVersion.Minor).$($nextVersion.Build)")
          if ($nextMsiVersion -le $previousMsiVersion) {
            throw "Windows Installer uses only the first three version fields; $nextVersion must increase beyond $previousVersion in those fields."
          }

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-x64-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        shell: cmd
        working-directory: .\src
        run: python build_tools/update_deps.py

      - name: Cache compiled Qt SDK
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: mozc-date-qt-${{ runner.os }}-${{ runner.arch }}-windows-2025-x64-release-6.9.1-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py', 'src/build_tools/vs_util.py') }}

      - name: Build Qt for x64
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: python build_tools/build_qt.py --release --confirm_license --target_arch=x64

      - name: Free disk space
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: rmdir third_party\qt_src /s /q

      - name: Test date and English word rewriters
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: bazelisk test //base:version_test //config:config_handler_test //rewriter:version_rewriter_test //rewriter:date_rewriter_test //rewriter:english_word_dictionary_rewriter_test //rewriter:rewriter_test --action_env=MOZC_VERSION=%MOZC_VERSION% --config release_build --platforms=//:windows-x86_64

      - name: Build x64 MSI
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: bazelisk build package --action_env=MOZC_VERSION=%MOZC_VERSION% --config release_build --platforms=//:windows-x86_64

      - name: Prepare release assets
        shell: pwsh
        run: |
          $msi = 'src/bazel-bin/win32/installer/Mozc64.msi'
          Copy-Item -LiteralPath $msi -Destination 'Mozc64_x64.msi'
          $hash = (Get-FileHash -LiteralPath 'Mozc64_x64.msi' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'Mozc64_x64.msi.sha256' -Value "$hash  Mozc64_x64.msi" -Encoding ascii

      - name: Verify release MSI metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expectedVersion = $env:MOZC_VERSION
          if ($expectedVersion -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "Unexpected release version: $expectedVersion"
          }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase((Resolve-Path 'Mozc64_x64.msi').Path, 0)
          function Get-MsiProperty([object]$database, [string]$name) {
            $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property``='$name'")
            $null = $view.Execute()
            $row = $view.Fetch()
            if ($null -eq $row) { return $null }
            return $row.StringData(1)
          }
          $productVersion = Get-MsiProperty $database 'ProductVersion'
          $productName = Get-MsiProperty $database 'ProductName'
          $manufacturer = Get-MsiProperty $database 'Manufacturer'
          $publisher = $database.SummaryInformation(0).Property(4)
          if ($productVersion -ne $expectedVersion) {
            throw "MSI ProductVersion '$productVersion' does not match tag version '$expectedVersion'"
          }
          if ($productName -ne 'mozc-date') {
            throw "Unexpected MSI ProductName: '$productName'"
          }
          if ($manufacturer -ne 'mozc-date Project' -or $publisher -ne 'mozc-date Project') {
            throw "Unexpected MSI publisher: Property='$manufacturer', Summary='$publisher'"
          }
          Write-Output "Verified MSI ProductVersion=$productVersion, ProductName=$productName, Publisher=$publisher"

      - name: Upload x64 MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Mozc64_x64
          path: |
            Mozc64_x64.msi
            Mozc64_x64.msi.sha256
          if-no-files-found: error

      - name: Publish tagged release for auto update
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME 'Mozc64_x64.msi' 'Mozc64_x64.msi.sha256' 'src/gui/about_dialog/update-mozc-date.ps1' --title "mozc-date $env:GITHUB_REF_NAME" --generate-notes
