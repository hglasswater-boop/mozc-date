name: Windows x64

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_x64:
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-x64-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        shell: cmd
        working-directory: .\src
        run: python build_tools/update_deps.py

      - name: Build Qt for x64
        shell: cmd
        working-directory: .\src
        run: python build_tools/build_qt.py --release --confirm_license --target_arch=x64

      - name: Free disk space
        shell: cmd
        working-directory: .\src
        run: rmdir third_party\qt_src /s /q

      - name: Test date and English word rewriters
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: bazelisk test //config:config_handler_test //rewriter:date_rewriter_test //rewriter:english_word_dictionary_rewriter_test //rewriter:rewriter_test --config release_build --platforms=//:windows-x86_64

      - name: Build x64 MSI
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: bazelisk build package --config release_build --platforms=//:windows-x86_64

      - name: Prepare release assets
        shell: pwsh
        run: |
          $msi = 'src/bazel-bin/win32/installer/Mozc64.msi'
          Copy-Item -LiteralPath $msi -Destination 'Mozc64_x64.msi'
          $hash = (Get-FileHash -LiteralPath 'Mozc64_x64.msi' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'Mozc64_x64.msi.sha256' -Value "$hash  Mozc64_x64.msi" -Encoding ascii

      - name: Upload x64 MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Mozc64_x64
          path: |
            Mozc64_x64.msi
            Mozc64_x64.msi.sha256
          if-no-files-found: error

      - name: Publish tagged release for auto update
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME 'Mozc64_x64.msi' 'Mozc64_x64.msi.sha256' 'src/gui/about_dialog/update-mozc-minimal.ps1' --title "Mozc Date English $env:GITHUB_REF_NAME" --generate-notes
