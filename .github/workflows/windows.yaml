name: Windows x64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_x64:
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Test product version and release validation
        shell: pwsh
        run: |
          python -m unittest discover --start-directory .github/scripts --pattern '*_test.py'
          if ($LASTEXITCODE -ne 0) { throw 'Release validation tests failed.' }
          Push-Location src
          try {
            python -m unittest build_tools.product_version_test win32.installer.build_installer_test build_tools.gen_win32_resource_header_test win32.tip.build_tip_forwarder_dll_test
            if ($LASTEXITCODE -ne 0) { throw 'Product version tests failed.' }
          }
          finally {
            Pop-Location
          }

      - name: Test reference dictionary import
        shell: pwsh
        run: |
          python -m unittest discover --start-directory tools/dictionary --pattern 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Dictionary import tests failed.' }

      - name: Test updater version compatibility
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/test-updater.ps1

      - name: Test Windows Installer metadata extraction
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/test-msi-metadata.ps1

      - name: Configure product version and check published release ordering
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @('configure', '--version-file', 'src/product_version.txt', '--materialize-version-file', '--env-file', $env:GITHUB_ENV,
                         '--output', 'release-version.json', '--test-targets', 'test-targets.json', '--pe-targets', 'pe-targets.json')
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            $publishedTags = @(gh api "repos/$($env:GITHUB_REPOSITORY)/releases?per_page=100" --paginate --jq '.[] | select(.draft == false) | .tag_name')
            if ($LASTEXITCODE -ne 0) { throw 'Could not read published release tags.' }
            ConvertTo-Json -InputObject @($publishedTags) | Set-Content -LiteralPath 'previous-release-tags.json' -Encoding utf8
            $arguments += @('--tag', $env:GITHUB_REF_NAME, '--previous-tags', 'previous-release-tags.json')
          }
          python .github/scripts/release_validation.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Product release version validation failed.' }

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-x64-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        shell: cmd
        working-directory: .\src
        run: python build_tools/update_deps.py

      - name: Cache compiled Qt SDK
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: mozc-date-qt-${{ runner.os }}-${{ runner.arch }}-windows-2025-x64-release-6.9.1-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py', 'src/build_tools/vs_util.py') }}

      - name: Build Qt for x64
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: python build_tools/build_qt.py --release --confirm_license --target_arch=x64

      - name: Free disk space
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: rmdir third_party\qt_src /s /q

      - name: Test versions, settings, date and English word rewriters
        shell: pwsh
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          $targets = @(Get-Content -LiteralPath '../test-targets.json' -Raw | ConvertFrom-Json)
          bazelisk test @targets --test_output=errors --action_env=MOZC_DATE_PRODUCT_VERSION --config release_build --platforms=//:windows-x86_64
          if ($LASTEXITCODE -ne 0) { throw 'Required Windows tests failed.' }

      - name: Build x64 MSI
        shell: pwsh
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package //base:product_version_json --action_env=MOZC_DATE_PRODUCT_VERSION --config release_build --platforms=//:windows-x86_64
          if ($LASTEXITCODE -ne 0) { throw 'Windows MSI build failed.' }
          $targets = @(Get-Content -LiteralPath '../pe-targets.json' -Raw | ConvertFrom-Json)
          $query = 'set(' + ($targets -join ' ') + ')'
          $binaryPaths = @(bazelisk cquery $query --output=files --action_env=MOZC_DATE_PRODUCT_VERSION --config release_build --platforms=//:windows-x86_64)
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate built PE binaries.' }
          $binaryPaths | Set-Content -LiteralPath '../built-pe-paths.txt' -Encoding utf8

      - name: Prepare release assets
        shell: pwsh
        run: |
          $msi = 'src/bazel-bin/win32/installer/Mozc64.msi'
          Copy-Item -LiteralPath $msi -Destination 'Mozc64_x64.msi'
          $hash = (Get-FileHash -LiteralPath 'Mozc64_x64.msi' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'Mozc64_x64.msi.sha256' -Value "$hash  Mozc64_x64.msi" -Encoding ascii

      - name: Verify product, About, MSI and PE versions
        shell: pwsh
        run: |
          ./.github/scripts/read-msi-metadata.ps1 -Path 'Mozc64_x64.msi' -OutputPath 'msi-metadata.json' -BinaryPathsFile 'built-pe-paths.txt' -BinaryBaseDirectory 'src'
          python .github/scripts/release_validation.py verify --expected release-version.json --generated src/bazel-bin/base/product_version.json --header src/bazel-bin/base/product_version_def.h --msi-metadata msi-metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Built product version metadata is inconsistent.' }

      - name: Record verified commit and feature evidence
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the built commit.' }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          python .github/scripts/release_validation.py manifest --expected release-version.json --test-targets test-targets.json --commit $commit --expected-commit $env:GITHUB_SHA --repository $env:GITHUB_REPOSITORY --run-url $runUrl --event $env:GITHUB_EVENT_NAME --msi Mozc64_x64.msi --msi-metadata msi-metadata.json --output release-manifest.json --summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw 'Could not record verified release evidence.' }

      - name: Upload x64 MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Mozc64_x64
          path: |
            Mozc64_x64.msi
            Mozc64_x64.msi.sha256
            release-manifest.json
            release-version.json
            msi-metadata.json
            test-targets.json
            pe-targets.json
            built-pe-paths.txt
            src/bazel-bin/base/product_version.json
            src/bazel-bin/base/product_version_def.h
          if-no-files-found: error

      - name: Publish tagged release for auto update
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME 'Mozc64_x64.msi' 'Mozc64_x64.msi.sha256' 'release-manifest.json' 'src/gui/about_dialog/update-mozc-date.ps1' --title "mozc-date $env:GITHUB_REF_NAME" --generate-notes --latest
